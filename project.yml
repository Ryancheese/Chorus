name: StereoSync
options:
  bundleIdPrefix: com.stereosync
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  StereoSyncCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Host:
    type: application
    platform: macOS
    sources:
      - path: Apps/Host/Host
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stereosync.host
        PRODUCT_NAME: StereoSync Host
        INFOPLIST_FILE: Apps/Host/Host/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StereoSync Host
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: StereoSync 需要局域网，才能发现并连接附近的 iPhone / iPad 扬声器。
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
        CODE_SIGN_ENTITLEMENTS: Apps/Host/Host/Host.entitlements
    dependencies:
      - package: StereoSyncCore
        product: StereoSyncCore
    entitlements:
      path: Apps/Host/Host/Host.entitlements

  Speaker:
    type: application
    platform: iOS
    sources:
      - path: Apps/Speaker/Speaker
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stereosync.speaker
        PRODUCT_NAME: StereoSync Speaker
        INFOPLIST_FILE: Apps/Speaker/Speaker/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StereoSync
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: StereoSync 需要局域网，才能被 Mac 发现并同步播放音频。
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/Frameworks"]
        CODE_SIGN_ENTITLEMENTS: Apps/Speaker/Speaker/Speaker.entitlements
    dependencies:
      - package: StereoSyncCore
        product: StereoSyncCore
    entitlements:
      path: Apps/Speaker/Speaker/Speaker.entitlements
