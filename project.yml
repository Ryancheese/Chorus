name: Chorus
options:
  bundleIdPrefix: com.chorus
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  ChorusCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  Host:
    build:
      targets:
        Host: all
    run:
      config: Debug
  Speaker:
    build:
      targets:
        Speaker: all
    run:
      config: Debug

targets:
  Host:
    type: application
    platform: macOS
    sources:
      - path: Apps/Host/Host
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chorus.host
        PRODUCT_NAME: Chorus Host
        INFOPLIST_FILE: Apps/Host/Host/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Chorus Host
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Chorus 需要局域网，才能发现并连接附近的 iPhone / iPad 扬声器。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Chorus 需要读取 BlackHole 虚拟音频输入，以统一延迟播放系统声音。
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
        CODE_SIGN_ENTITLEMENTS: Apps/Host/Host/Host.entitlements
    dependencies:
      - package: ChorusCore
        product: ChorusCore
    entitlements:
      path: Apps/Host/Host/Host.entitlements

  Speaker:
    type: application
    platform: iOS
    sources:
      - path: Apps/Speaker/Speaker
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chorus.speaker
        PRODUCT_NAME: Chorus Speaker
        INFOPLIST_FILE: Apps/Speaker/Speaker/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Chorus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Chorus 需要局域网，才能被 Mac 发现并同步播放音频。
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/Frameworks"]
        CODE_SIGN_ENTITLEMENTS: Apps/Speaker/Speaker/Speaker.entitlements
    dependencies:
      - package: ChorusCore
        product: ChorusCore
      - target: SpeakerLiveActivity
        embed: true
    entitlements:
      path: Apps/Speaker/Speaker/Speaker.entitlements

  SpeakerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/SpeakerLiveActivity
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chorus.speaker.liveactivity
        PRODUCT_NAME: Chorus Live Activity
        INFOPLIST_FILE: Apps/SpeakerLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: ChorusCore
        product: ChorusCore
