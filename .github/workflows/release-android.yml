name: Release Android APK

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the release tag artifact (e.g. 1.0.5)"
        required: true
        default: "1.0.5"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare artifact
        id: artifact
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          fi
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          DEST="$GITHUB_WORKSPACE/ChorusSpeaker-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=ChorusSpeaker-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-v{0}', github.event.inputs.version) }}
          name: Chorus Speaker Android ${{ steps.artifact.outputs.version }}
          body: |
            Android Speaker 安装包（侧载）。

            安装：下载 APK 后在手机上打开；若系统拦截，允许「未知来源」安装。

            与 Host 同一 Wi‑Fi，关闭 VPN；公司/访客网常有客户端隔离，请改用个人热点。

            SHA-256: `${{ steps.artifact.outputs.sha256 }}`
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
